name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Um push novo no mesmo PR/branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Informativo por enquanto: há vulnerabilidades conhecidas sem correção
      # disponível (ex.: xlsx). O resultado aparece como aviso no run, sem
      # deixar o check vermelho. Quando forem resolvidas, troque este passo por
      # `npm audit --omit=dev --audit-level=high` para bloquear PRs.
      - name: npm audit (produção)
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            echo "::warning title=npm audit::Há vulnerabilidades altas ou críticas em dependências de produção. Veja o log deste passo."
          fi
