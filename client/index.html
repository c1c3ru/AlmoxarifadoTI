    <!--
      integrity: Google Fonts negotia o CSS por User-Agent (formatos/unicode-ranges
      diferentes por navegador). O hash abaixo foi calculado a partir da resposta
      real para esta URL exata usando um User-Agent de navegador moderno (evergreen);
      se o Google alterar o conteúdo servido para esse perfil, o navegador passa a
      bloquear a folha de estilo (fail-safe: cai para as fontes de fallback do
      Tailwind, sem quebrar a aplicação) até o hash ser recalculado.
    -->
