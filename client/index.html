<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>SGAT-TI · Almoxarifado de T.I.</title>
    <meta name="description" content="Sistema de Gestão de Almoxarifado de T.I. do IFCE" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Só as famílias que o Tailwind usa (tailwind.config.ts: sans = Plus Jakarta
      Sans, mono = JetBrains Mono). Sem atributo integrity: o Google Fonts gera o
      CSS conforme o navegador (formatos e unicode-ranges diferentes), então um
      hash fixo quebra em parte dos navegadores e a folha inteira é bloqueada.
      A origem continua restrita pela CSP (style-src fonts.googleapis.com,
      font-src fonts.gstatic.com).
    -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <!-- Font Awesome: hospedado localmente (client/public/vendor/fontawesome) em vez de cdnjs.
         Elimina a dependência de CDN de terceiros para este recurso (e a necessidade de SRI,
         já que é servido pela mesma origem da aplicação). -->
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
